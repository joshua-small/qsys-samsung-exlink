name: Publish package and Library feed
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: library-feed
  cancel-in-progress: false
jobs:
  package:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pack
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          dotnet pack SamsungExLink.csproj -o dist -p:PackageVersion="$VERSION"
          cp content/SamsungExLink.qplug dist/SamsungExLink.qplug
          cd dist
          sha256sum *.nupkg *.qplug > SHA256SUMS
      - name: Attach release files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.nupkg dist/*.qplug dist/SHA256SUMS
  feed:
    needs: package
    if: always() && (needs.package.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/configure-pages@v5
        id: pages
      - run: dotnet tool install sleet --tool-path "$RUNNER_TEMP/sleet" --version 7.2.0
      - name: Generate feed from releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/feed.py --repository "$REPOSITORY" --base-url "$BASE_URL" --sleet "$RUNNER_TEMP/sleet/sleet"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: feed
      - uses: actions/deploy-pages@v4
        id: deployment
